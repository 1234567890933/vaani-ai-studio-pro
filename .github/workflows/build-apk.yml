name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" \
            "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Locate the project root
        run: |
          DIR=$(find . -maxdepth 3 -name 'settings.gradle*' -not -path './vendor/*' -not -path './tools/*' | head -n1 | xargs -r dirname)
          echo "PROJECT_DIR=${DIR:-.}" >> "$GITHUB_ENV"
          echo "Project root: ${DIR:-.}"

      - name: Check Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "MISSING_WRAPPER=1" >> "$GITHUB_ENV"
            echo "wrapper jar missing - will regenerate"
          fi

      - name: Set up Gradle (only if wrapper missing)
        if: env.MISSING_WRAPPER == '1'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Regenerate wrapper (only if missing)
        if: env.MISSING_WRAPPER == '1'
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.9

      - name: Warn about oversized bundled assets
        run: |
          find . -type f -size +90M -not -path './.git/*' -print | while read f; do
            echo "::warning::Large file (>90MB): $f"
          done || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
